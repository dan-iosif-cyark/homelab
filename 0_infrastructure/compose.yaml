name: infrastructure

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_socket

  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DESEC_TOKEN: ${TRAEFIK_DESEC_TOKEN:?required}
    volumes:
      - ${APPDATA}/traefik:/etc/traefik
      - ${APPDATA}/traefik/logs:/var/log/traefik
      - ${APPDATA}/traefik/crowdsec/lapi-key:/etc/traefik/crowdsec/lapi-key
    networks:
      - ingress
      - towernet
      - frp
      - docker_socket
      - crowdsec
    # The Unraid server's LAN address, not every interface.
    ports:
      - "192.168.1.192:80:80"
      - "192.168.1.192:443:443"
    labels:
      # Unraid UI
      net.unraid.docker.icon: "https://raw.githubusercontent.com/ibracorp/unraid-templates/master/icons/traefik.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
      net.unraid.docker.shell: "sh"

  frpc:
    image: fatedier/frpc:v0.71.0@sha256:99ece6a2b62cfc68731e0df289af804ff1c699911cfc47871856434f1d6d53ee
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/frp/frpc.toml"
    volumes:
      - ${APPDATA}/frpc/frpc.toml:/etc/frp/frpc.toml:ro
    networks:
      - frp

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      COLLECTIONS: >-
        crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
    volumes:
      - ${APPDATA}/crowdsec/config:/etc/crowdsec
      - ${APPDATA}/crowdsec/data:/var/lib/crowdsec/data
      - ${APPDATA}/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ${APPDATA}/traefik/logs:/var/log/traefik:ro
    networks:
      - crowdsec
    labels:
      bakers.monitoring.logs: "true"

networks:
  crowdsec: # frpc hands Traefik the traffic arriving at the VPS, with PROXY protocol.

  # Traefik trusts PROXY headers from this subnet (traefik.yml), so nothing
  # else may join it.
  frp:
    ipam:
      config:
        - subnet: 10.200.200.0/29
  docker_socket:
    name: docker_socket
    external: true
  ingress:
    name: ingress
    external: true
  towernet:
    # Legacy; Traefik leaves it once the last container has moved to ingress.
    name: towernet
    external: true
