name: scans

services:
  paperless-db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      # TODO(hardening): rotate with ALTER USER and move to 1Password. This is
      # Paperless's default, reachable only on the internal network.
      POSTGRES_PASSWORD: paperless
    volumes:
      - ${APPDATA}/paperless_db:/var/lib/postgresql
    networks:
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      bakers.monitoring.logs: "true"

  paperless-broker:
    image: redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3
    restart: unless-stopped
    volumes:
      - ${APPDATA}/paperless_redis:/data
    networks:
      - paperless
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      bakers.monitoring.logs: "true"

  gotenberg:
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
    # Chromium converts .eml files; keep external content such as tracking
    # pixels and JavaScript out.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - paperless
    labels:
      bakers.monitoring.logs: "true"

  tika:
    image: apache/tika:4.0.0@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
    restart: unless-stopped
    networks:
      - paperless
    labels:
      bakers.monitoring.logs: "true"

  paperless:
    image: paperlessngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    restart: unless-stopped
    depends_on:
      gotenberg:
        condition: service_started
      paperless-broker:
        condition: service_healthy
      paperless-db:
        condition: service_healthy
      tika:
        condition: service_started
    environment:
      PAPERLESS_URL: https://scans.bakers.house
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?required}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      # Sign-in is through Authentik only.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authentik","name":"authentik","client_id":"${PAPERLESS_OIDC_CLIENT_ID:?required}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET:?required}","settings":{"server_url":"https://auth.bakers.house/application/o/paperless-ngx/.well-known/openid-configuration","fetch_userinfo":true}}],"SCOPE":["openid","profile","email"]}}'
      PAPERLESS_LOGOUT_REDIRECT_URL: https://auth.bakers.house/application/o/paperless-ngx/end-session/
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
    volumes:
      - ${DATA}/media/paperless/data:/usr/src/paperless/data
      - ${DATA}/media/paperless/media:/usr/src/paperless/media
      - ${DATA}/media/paperless/export:/usr/src/paperless/export
      - ${DATA}/media/paperless/consume:/usr/src/paperless/consume
    networks:
      - ingress
      - paperless
    labels:
      # Unraid
      net.unraid.docker.icon: "https://raw.githubusercontent.com/selfhosters/unRAID-CA-templates/master/templates/img/paperless.png"
      net.unraid.docker.webui: "https://scans.bakers.house"

      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "ingress"
      traefik.http.routers.paperless-ngx.rule: "Host(`scans.bakers.house`)"
      traefik.http.routers.paperless-ngx.entrypoints: "https"
      traefik.http.services.paperless-ngx.loadbalancer.server.port: "8000"

      bakers.monitoring.logs: "true"

networks:
  # The database, broker and converters are reachable only from Paperless.
  paperless:
    internal: true
  ingress:
    name: ingress
    external: true
