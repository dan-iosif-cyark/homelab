name: observability

services:
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ${APPDATA}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${APPDATA}/alloy/data:/var/lib/alloy
      - ${APPDATA}/traefik/logs:/logs/traefik:ro
    networks:
      - docker_socket
      - monitoring

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ${APPDATA}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${APPDATA}/loki/data:/loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${APPDATA}/grafana:/var/lib/grafana
    networks:
      - ingress
      - monitoring
    labels:
      # Unraid
      net.unraid.docker.webui: "https://grafana.${DOMAIN}"
      net.unraid.docker.shell: "sh"

      # Traefik
      traefik.enable: "true"
      traefik.docker.network: "ingress"
      traefik.http.routers.grafana.rule: "Host(`grafana.bakers.house`)"
      traefik.http.routers.grafana.entrypoints: "https"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

networks:
  monitoring:
  docker_socket:
    name: docker_socket
    external: true
  ingress:
    name: ingress
    external: true
