# Prettier owns layout; yamllint catches what prettier won't (duplicate keys,
# ambiguous truthy values). Rules that fight prettier are relaxed to match it.
extends: default

rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  document-start: disable
  line-length: disable
  truthy:
    check-keys: false # GitHub Actions' `on:` key
